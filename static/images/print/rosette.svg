<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- The medallion at the centre of the cloth. One petal, rotated twelve
       times about (100,100) — twelvefold symmetry is what makes it read as a
       medallion rather than as a flower.

       Radii, outward: centre disc 11, annulus 18–24, beads at 32,
       petals from 42 to 92. Nothing overlaps.

       No fill or stroke: the CSS mask paints these shapes. The annulus is cut
       with fill-rule="evenodd" rather than a stroke, since stroke defaults to
       none and would be invisible. -->
  <defs>
    <path id="petal" d="M100 8 C112 28 114 44 100 58 C86 44 88 28 100 8 Z"/>
    <circle id="bead" cx="100" cy="68" r="3.6"/>
  </defs>

  <use href="#petal" transform="rotate(0 100 100)"/>
  <use href="#petal" transform="rotate(30 100 100)"/>
  <use href="#petal" transform="rotate(60 100 100)"/>
  <use href="#petal" transform="rotate(90 100 100)"/>
  <use href="#petal" transform="rotate(120 100 100)"/>
  <use href="#petal" transform="rotate(150 100 100)"/>
  <use href="#petal" transform="rotate(180 100 100)"/>
  <use href="#petal" transform="rotate(210 100 100)"/>
  <use href="#petal" transform="rotate(240 100 100)"/>
  <use href="#petal" transform="rotate(270 100 100)"/>
  <use href="#petal" transform="rotate(300 100 100)"/>
  <use href="#petal" transform="rotate(330 100 100)"/>

  <use href="#bead" transform="rotate(15 100 100)"/>
  <use href="#bead" transform="rotate(45 100 100)"/>
  <use href="#bead" transform="rotate(75 100 100)"/>
  <use href="#bead" transform="rotate(105 100 100)"/>
  <use href="#bead" transform="rotate(135 100 100)"/>
  <use href="#bead" transform="rotate(165 100 100)"/>
  <use href="#bead" transform="rotate(195 100 100)"/>
  <use href="#bead" transform="rotate(225 100 100)"/>
  <use href="#bead" transform="rotate(255 100 100)"/>
  <use href="#bead" transform="rotate(285 100 100)"/>
  <use href="#bead" transform="rotate(315 100 100)"/>
  <use href="#bead" transform="rotate(345 100 100)"/>

  <path fill-rule="evenodd" d="M100 76 A24 24 0 1 0 100 124 A24 24 0 1 0 100 76 Z M100 82 A18 18 0 1 1 100 118 A18 18 0 1 1 100 82 Z"/>
  <circle cx="100" cy="100" r="11"/>
</svg>
