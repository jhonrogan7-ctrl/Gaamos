<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 28" width="120" height="28">
  <!-- Georgian lurji supra border, redrawn. Three stacked rhythms: a diamond
       and dot rule, a row of boteh, and the rule mirrored back.

       Motifs are defined once at the origin and placed by <use>, so the tile's
       rhythm reads as a list of offsets instead of being buried in path data —
       and so the seam check can prove no motif crosses x=0 or x=120. Each row
       must also close on the tile: count x step must equal 120, so the last
       motif of one tile is exactly one step from the first of the next.

       No fill or stroke: the CSS mask paints these shapes. -->
  <defs>
    <path id="dia" d="M0 -3 L3 0 L0 3 L-3 0 Z"/>
    <circle id="dot" cx="0" cy="0" r="1.6"/>
    <path id="boteh" d="M0 5 C3.6 5 4.2 0.6 1.6 -3.2 C0.6 -4.6 -1 -5 -2 -3.8 C-3.4 -2.2 -3.6 1.2 -2.4 3 C-1.6 4.4 -0.8 5 0 5 Z"/>
  </defs>

  <use href="#dia" transform="translate(5 4)"/>
  <use href="#dot" transform="translate(15 4)"/>
  <use href="#dia" transform="translate(25 4)"/>
  <use href="#dot" transform="translate(35 4)"/>
  <use href="#dia" transform="translate(45 4)"/>
  <use href="#dot" transform="translate(55 4)"/>
  <use href="#dia" transform="translate(65 4)"/>
  <use href="#dot" transform="translate(75 4)"/>
  <use href="#dia" transform="translate(85 4)"/>
  <use href="#dot" transform="translate(95 4)"/>
  <use href="#dia" transform="translate(105 4)"/>
  <use href="#dot" transform="translate(115 4)"/>

  <use href="#boteh" transform="translate(10 14)"/>
  <use href="#boteh" transform="translate(30 14) scale(-1 1)"/>
  <use href="#boteh" transform="translate(50 14)"/>
  <use href="#boteh" transform="translate(70 14) scale(-1 1)"/>
  <use href="#boteh" transform="translate(90 14)"/>
  <use href="#boteh" transform="translate(110 14) scale(-1 1)"/>

  <use href="#dia" transform="translate(5 24)"/>
  <use href="#dot" transform="translate(15 24)"/>
  <use href="#dia" transform="translate(25 24)"/>
  <use href="#dot" transform="translate(35 24)"/>
  <use href="#dia" transform="translate(45 24)"/>
  <use href="#dot" transform="translate(55 24)"/>
  <use href="#dia" transform="translate(65 24)"/>
  <use href="#dot" transform="translate(75 24)"/>
  <use href="#dia" transform="translate(85 24)"/>
  <use href="#dot" transform="translate(95 24)"/>
  <use href="#dia" transform="translate(105 24)"/>
  <use href="#dot" transform="translate(115 24)"/>
</svg>
