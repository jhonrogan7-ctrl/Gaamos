{% load i18n %}
<div id="contact-panel" class="orn-form orn-form-success">
  <span class="orn-m orn-m-medallion" aria-hidden="true"></span>
  <h3>{% translate "Request received!" %}</h3>
  <p>{% translate "Thanks — a Gaamos representative will contact you within one business day." %}</p>
  <a href="#contact" class="orn-btn orn-btn-outline orn-btn-block" style="margin-top:20px"
     hx-get="{% url 'contact' %}" hx-target="#contact-panel" hx-swap="outerHTML">{% translate "Send another request" %}</a>
</div>
