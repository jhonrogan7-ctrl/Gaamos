{% load i18n %}
<form id="contact-panel" class="orn-form"
      hx-post="{% url 'contact' %}" hx-target="#contact-panel" hx-swap="outerHTML"
      x-data="{ vtype: '{{ values.venue_type|default:'Café'|escapejs }}' }">
  {% csrf_token %}
  <div class="orn-form-grid">
    <label class="orn-field">
      <span class="orn-label">{% translate "Your name" %} *</span>
      <input name="name" value="{{ values.name|default:'' }}" placeholder="{% translate 'Suman Thapa' %}"
             class="orn-input" required>
    </label>
    <label class="orn-field">
      <span class="orn-label">{% translate "Venue name" %} *</span>
      <input name="venue_name" value="{{ values.venue_name|default:'' }}" placeholder="{% translate 'Your Hotel' %}"
             class="orn-input" required>
    </label>
    <label class="orn-field">
      <span class="orn-label">{% translate "Phone" %} *</span>
      <input name="phone" value="{{ values.phone|default:'' }}" placeholder="+977 98XX-XXXXXX"
             class="orn-input" required>
    </label>
    <label class="orn-field">
      <span class="orn-label">{% translate "Email" %}</span>
      <input name="email" type="email" value="{{ values.email|default:'' }}" placeholder="you@cafe.com"
             class="orn-input">
    </label>
    <div class="orn-field orn-span-2">
      <span class="orn-label">{% translate "Venue type" %}</span>
      <div class="orn-vtypes">
        {% for value, label in venue_types %}
        <button type="button" class="orn-vtype" @click="vtype = '{{ value|escapejs }}'"
                :class="{ 'is-on': vtype === '{{ value|escapejs }}' }">{{ label }}</button>
        {% endfor %}
      </div>
      <input type="hidden" name="venue_type" :value="vtype">
    </div>
    <label class="orn-field orn-span-2">
      <span class="orn-label">{% translate "What do you need?" %}</span>
      <textarea name="message" rows="3" placeholder="{% translate 'e.g. 2 branches, ~60 menu items, table ordering…' %}"
                class="orn-input">{{ values.message|default:'' }}</textarea>
    </label>
  </div>
  {% if error %}
  <div class="orn-form-error">{{ error }}</div>
  {% endif %}
  <button type="submit" class="orn-btn orn-btn-block" style="margin-top:20px">{% translate "Request a callback" %}</button>
  <p class="orn-form-note">{% translate "We'll only use your details to contact you about Gaamos." %}</p>
</form>
