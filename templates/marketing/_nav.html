{% load i18n static %}{% get_current_language as cur %}
<header class="orn-header">
  <div class="orn-header-bar">
    <a href="#top" class="orn-logo" aria-label="Gaamos">
      <span class="orn-m orn-m-medallion orn-logo-medallion" aria-hidden="true"></span>
      <img src="{% static 'images/gaamos-logo.png' %}" alt="Gaamos" width="302" height="87">
    </a>
    <nav class="orn-nav" aria-label="{% translate 'Primary' %}">
      <a href="#features">{% translate "Features" %}</a>
      <a href="#how">{% translate "How it works" %}</a>
      <a href="#pricing">{% translate "Pricing" %}</a>
      <a href="#contact">{% translate "Contact" %}</a>
    </nav>
    <span class="orn-spacer"></span>
    <div class="orn-lang orn-mono">
      <a href="/en/" class="{% if cur == 'en' %}is-on{% endif %}">EN</a>
      <a href="/ne/" class="{% if cur == 'ne' %}is-on{% endif %}">ने</a>
      <a href="/ka/" class="{% if cur == 'ka' %}is-on{% endif %}">ქა</a>
    </div>
    <a href="#contact" class="orn-btn orn-btn-sm">{% translate "Get started" %}</a>
  </div>
  <div class="orn-band" aria-hidden="true"><i></i></div>
</header>
